spring.datasource.url=jdbc:postgresql://db:5432/onthemoney
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:devpassword}
# Schema is managed by Flyway (db/migration); Hibernate only validates it matches.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.address=0.0.0.0
server.port=8080

finnhub.api-key=${FINNHUB_API_KEY:}

# Path to the C++ Monte Carlo engine binary. In Docker this is /app/run_engine
# (set via ENGINE_BINARY_PATH); locally it defaults to a fresh engine build.
engine.binary-path=${ENGINE_BINARY_PATH:engine/build/src/run_engine}
