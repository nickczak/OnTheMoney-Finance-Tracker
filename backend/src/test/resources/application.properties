spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

finnhub.api-key=test

# Plaid config: same defaults as the main file so the full context starts offline.
plaid.client-id=${PLAID_CLIENT_ID:your_plaid_client_id}
plaid.secret=${PLAID_SECRET:your_plaid_secret}
plaid.webhook-secret=${PLAID_WEBHOOK_SECRET:your_plaid_webhook_secret}
plaid.env=sandbox
plaid.webhook-url=${PLAID_WEBHOOK_URL:}
plaid.redirect-uri=${PLAID_REDIRECT_URI:}
application.secret=${APPLICATION_SECRET:devsecret}
