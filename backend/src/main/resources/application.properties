spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onthemoney}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:app}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:devpassword}}
# Hibernate creates/updates the schema from the JPA entities.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

server.address=0.0.0.0
server.port=${PORT:8080}

finnhub.api-key=${FINNHUB_API_KEY:}

# Plaid
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.webhook-secret=${PLAID_WEBHOOK_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
# Public URL Plaid should deliver webhooks to. In local dev, expose via ngrok;
# in production this is https://onthemoney.site/api/plaid/webhook
plaid.webhook-url=${PLAID_WEBHOOK_URL:}
# Landing page for OAuth-enabled institutions (e.g. Chase). Optional.
plaid.redirect-uri=${PLAID_REDIRECT_URI:}
application.secret=${APPLICATION_SECRET:devsecret}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,https://onthemoney.site,https://www.onthemoney.site}

# Path to the C++ Monte Carlo engine binary. In Docker this is /app/run_engine
# (set via ENGINE_BINARY_PATH); locally it defaults to a fresh engine build.
engine.binary-path=${ENGINE_BINARY_PATH:engine/build/src/run_engine}
