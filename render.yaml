services:
  - type: web
    name: onthemoney-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: PORT
        value: "8080"
      - key: DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://onthemoney.site,https://www.onthemoney.site
      - key: APPLICATION_SECRET
        generateValue: true
      - key: ENGINE_BINARY_PATH
        value: /app/run_engine
      - key: FINNHUB_API_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_WEBHOOK_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: PLAID_REDIRECT_URI
        value: https://onthemoney.site/accounts
