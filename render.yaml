services:
  - type: web
    name: onthemoney-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: onthemoney-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: onthemoney-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: onthemoney-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: onthemoney-db
          property: database
      - key: PORT
        value: "8080"
      - key: DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://onthemoney-web.onrender.com,https://onthemoney.site,https://www.onthemoney.site
      - key: APPLICATION_SECRET
        generateValue: true
      - key: ENGINE_BINARY_PATH
        value: /app/run_engine
      - key: FINNHUB_API_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_WEBHOOK_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_WEBHOOK_URL
        sync: false
      - key: PLAID_REDIRECT_URI
        value: https://onthemoney-web.onrender.com/accounts

  - type: web
    name: onthemoney-web
    runtime: static
    buildCommand: npm ci && npm run build
    rootDir: web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://onthemoney-api.onrender.com

databases:
  - name: onthemoney-db
    databaseName: onthemoney
    user: app
    plan: free
    region: oregon
