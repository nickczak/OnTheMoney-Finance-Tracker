repos:
- repo: local
  hooks:
  - id: clang-format-17
    name: clang-format-17
    description: Format C++
    entry: clang-format-17 -i
    language: system
    files: \.(c|cpp|h|hpp|cc|hh)$
  - id: spotless
    name: spotless
    description: Format Java with Spotless (google-java-format)
    entry: bash -c 'cd backend && ./gradlew spotlessApply'
    language: system
    files: \.java$
    pass_filenames: false
  - id: eslint
    name: eslint
    description: Lint TypeScript/React with ESLint
    entry: bash -c 'cd ios && npx expo lint --fix'
    language: system
    files: \.(ts|tsx)$
    pass_filenames: false
  - id: prettier
    name: prettier
    description: Format TypeScript/React with Prettier
    entry: bash -c 'cd ios && npx prettier --write .'
    language: system
    files: \.(ts|tsx)$
    pass_filenames: false
