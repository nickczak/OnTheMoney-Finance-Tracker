repos:
- repo: local
  hooks:
  - id: clang-format-17
    name: clang-format-17
    description: Format C++
    entry: clang-format-17 -i
    language: system
    files: \.(c|cpp|h|hpp|cc|hh)$
  - id: spotless
    name: spotless
    description: Format Java with Spotless (google-java-format)
    entry: bash -c 'cd backend && ./gradlew spotlessApply'
    language: system
    files: \.java$
    pass_filenames: false
  - id: eslint
    name: eslint
    description: Lint the staged TypeScript/React files with ESLint
    entry: bash -c 'cd web && files=("${@#web/}") && npx eslint "${files[@]}"' --
    language: system
    files: \.(ts|tsx)$
  - id: prettier
    name: prettier
    description: Format the staged TypeScript/React files with Prettier
    entry: bash -c 'cd web && files=("${@#web/}") && npx prettier --write "${files[@]}"' --
    language: system
    files: \.(ts|tsx)$
