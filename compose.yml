services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onthemoney
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d onthemoney"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      ENGINE_BINARY_PATH: /app/run_engine
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
