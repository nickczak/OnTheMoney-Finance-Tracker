name: Deploy

on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: vps-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build backend jar
        working-directory: backend
        run: ./gradlew bootJar

      - name: Build C++ engine
        working-directory: engine
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DON_THE_MONEY_BUILD_TESTS=OFF
          cmake --build build -j

      - name: Build production Docker image
        run: |
          docker build -t onthemoney-app:latest .
          docker save onthemoney-app:latest -o app-image.tar

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        env:
          VITE_API_URL: https://onthemoney.site
        run: |
          npm ci
          npm run build

      - name: Stage artifacts
        run: |
          mkdir -p deploy-staging
          cp app-image.tar deploy-staging/app-image.tar
          cp compose.yml deploy-staging/compose.yml
          cp -a web/dist deploy-staging/dist
          tar -czf deploy.tar.gz -C deploy-staging .

      - name: Upload artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp

      - name: Install artifacts and restart service
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/onthemoney
            rm -rf staging
            mkdir -p staging
            tar -xzf /tmp/deploy.tar.gz -C staging

            # The production backend and PostgreSQL both run in Docker.
            # Keep the old systemd services from competing for ports.
            sudo systemctl disable --now onthemoney || true
            sudo systemctl disable --now postgresql || true

            sudo docker load -i staging/app-image.tar
            cp -f staging/compose.yml compose.yml
            rm -rf web/dist.old
            mv web/dist web/dist.old 2>/dev/null || true
            mv staging/dist web/dist

            # The VPS must already have /opt/onthemoney/.env with DB and Plaid secrets.
            sudo docker pull postgres:16-alpine
            sudo docker compose up -d db app

            # Health check (up to 180s); roll back the web assets on failure.
            for i in $(seq 1 90); do
              if curl -fsS http://localhost:8080/api/status >/dev/null; then
                rm -rf web/dist.old staging /tmp/deploy.tar.gz
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed — rolling back"
            sudo docker compose logs --tail=100 app db || true
            sudo docker compose stop app db || true
            rm -rf web/dist
            mv web/dist.old web/dist
            exit 1
