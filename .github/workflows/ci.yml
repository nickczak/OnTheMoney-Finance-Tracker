name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    backend:
      name: Backend (Java 17 / Gradle)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: 'gradle'

        - name: Format check (Spotless)
          working-directory: backend
          run: ./gradlew spotlessCheck

        - name: Test + Build
          working-directory: backend
          run: ./gradlew build

    engine:
      name: C++ Engine (Cmake / Catch2)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Install dependencies
          run: sudo apt-get update && sudo apt-get install -y cmake g++ nlohmann-json3-dev catch2

        - name: Configure
          working-directory: engine
          run: cmake -S . -B build

        - name: Build
          working-directory: engine
          run: cmake --build build -j

        - name: Test
          working-directory: engine
          run: ctest --test-dir build --output-on-failure

    ios:
      name: iOS App (Expo / TypeScript)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ios/package-lock.json

        - name: Install
          working-directory: ios
          run: npm ci

        - name: Typecheck
          working-directory: ios
          run: npm run typecheck

        - name: Lint
          working-directory: ios
          run: npm run lint

        - name: Format check
          working-directory: ios
          run: npm run format:check
